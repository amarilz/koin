
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-koin
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read version and check release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r --arg name "koin" \
              '.packages[] | select(.name == $name) | .version')"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Cargo.toml ($VERSION) and VERSION ($RELEASE_VERSION) differ." >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG needs to be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: koin-linux-x86_64
            extension: tar.gz

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: koin-linux-aarch64
            extension: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: koin-windows-x86_64
            extension: zip

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: koin-macos-x86_64
            extension: tar.gz

          - os: macos-15
            target: aarch64-apple-darwin
            artifact: koin-macos-aarch64
            extension: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          tar -czf \
            "dist/${{ matrix.artifact }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            koin

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/koin.exe" `
            -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and publish release
    needs:
      - prepare
      - build

    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."

            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"

            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points to another commit." >&2
              exit 1
            fi
          elif [[ "$?" == 2 ]]; then
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          else
            echo "Could not check the remote tag $TAG." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          PREVIOUS_TAG="$(git describe \
            --tags \
            --abbrev=0 \
            --match 'v[0-9]*' \
            "$TAG^" 2>/dev/null || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            RANGE="$PREVIOUS_TAG..$TAG"
          else
            RANGE="$TAG"
          fi

          declare -A sections=(
            [feat]="Features"
            [fix]="Bug Fixes"
            [perf]="Performance"
            [refactor]="Refactoring"
            [docs]="Documentation"
            [test]="Tests"
            [build]="Build"
            [ci]="CI"
            [chore]="Maintenance"
          )

          declare -A notes

          conventional_commit_regex='^([a-z]+)(\([^)]+\))?!?:[[:space:]]+(.+)$'

          while IFS= read -r subject; do
            if [[ "$subject" =~ $conventional_commit_regex ]]; then
              type="${BASH_REMATCH[1]}"
              message="${BASH_REMATCH[3]}"

              if [[ -n "${sections[$type]:-}" ]]; then
                notes[$type]+="- $message"$'\n'
              fi
            fi
          done < <(git log "$RANGE" --no-merges --format=%s)

          {
            echo "# $TAG"
            echo

            for type in feat fix perf refactor docs test build ci chore; do
              if [[ -n "${notes[$type]:-}" ]]; then
                echo "## ${sections[$type]}"
                echo
                printf '%s\n' "${notes[$type]}"
              fi
            done

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
          } > release-notes.md

          prerelease=()
          if [[ "${TAG%%+*}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$TAG" dist/* "${prerelease[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
