
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            exit 0
          fi

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          declare -A sections=(
            [feat]="Features"
            [fix]="Bug Fixes"
            [perf]="Performance"
            [refactor]="Refactoring"
            [docs]="Documentation"
            [test]="Tests"
            [build]="Build"
            [ci]="CI"
            [chore]="Maintenance"
          )

          declare -A notes

          while IFS= read -r subject; do
            if [[ "$subject" =~ ^([a-z]+)(\([^)]+\))?!?:[[:space:]]+(.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              message="${BASH_REMATCH[3]}"

              if [[ -n "${sections[$type]:-}" ]]; then
                notes[$type]+="- $message"$'\n'
              fi
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:%s)

          {
            echo "# $TAG"
            echo

            for type in feat fix perf refactor docs test build ci chore; do
              if [[ -n "${notes[$type]:-}" ]]; then
                echo "## ${sections[$type]}"
                echo
                printf '%s\n' "${notes[$type]}"
              fi
            done

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
          } > release-notes.md

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
