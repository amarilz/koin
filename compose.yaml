version: "3.9"

services:
  koin-postgres:
    image: postgres:18
    container_name: koin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - koin_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-backup-sidecar:
    image: amarilz/postgres-backup-sidecar:0.0.1
    container_name: postgres-backup-sidecar
    restart: unless-stopped
    depends_on:
      koin-postgres:
        condition: service_healthy
    stop_grace_period: 2m
    environment:
      PGHOST: koin-postgres
      PGPORT: 5432
      PGDATABASE: "${DB_NAME}"
      PGUSER: "${DB_USER}"
      PGPASSWORD: "${DB_PASSWORD}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_COMPRESSION: "${BACKUP_COMPRESSION:-gzip:6}"
      BACKUP_ON_START: "false"
      BACKUP_ON_SHUTDOWN: "true"
    volumes:
      - "${BACKUP_BASE_PATH}:/backups"
    networks:
      - koin_network

  koin-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION}
    image: koin:latest
    container_name: koin
    restart: unless-stopped
    depends_on:
      - koin-postgres
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@koin-postgres:5432/${DB_NAME}?sslmode=disable
      - API_TOKEN=${API_TOKEN:-dev-token}
    ports:
      - "8080:8080"
    networks:
      - koin_network

volumes:
  postgres_data:

networks:
  koin_network:
    name: koin_network
    driver: bridge
