services:
  whisper:
    image: whisper-transcription-service:1.0.0
    container_name: whisper-transcription-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER_MODEL_PATH: /models/large-v3-turbo.pt
      WHISPER_LANGUAGE: Italian
    volumes:
      - "${WHISPER_MODELS_DIR:-${HOME}/.cache/whisper}:/models:ro"
    restart: unless-stopped
    networks:
      - koin_network

networks:
  koin_network:
    name: koin_network
    driver: bridge
